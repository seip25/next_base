user nginx;
worker_processes auto;
worker_rlimit_nofile 16384;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    client_body_buffer_size 128k;
    client_max_body_size 20m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # proxy_cache_path /tmp/nginx_proxy_cache levels=1:2 keys_zone=NEXTJS_CACHE:10m inactive=60m max_size=500m use_temp_path=off;
    # proxy_cache_key "$scheme$request_method$host$request_uri";
    # proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    # limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/s;

    upstream nextjs_upstream {
        server nextjs:3000;
    }

    upstream websocket_upstream {
        server nextjs:3000;
    }

    server {
        listen 80;
        server_name _;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(config|ini|log|conf|sql|bak|yaml|yml|env)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /_next/image {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /public/ {
            alias /usr/share/nginx/html/public/;
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        location /ws {
            proxy_pass http://websocket_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            # limit_req zone=api_limit burst=30 nodelay;
            # limit_req_status 429;

            # set $skip_cache 0;
            # if ($request_method != GET) { set $skip_cache 1; }
            # if ($http_authorization != "") { set $skip_cache 1; }
            # if ($http_x_api_key != "") { set $skip_cache 1; }
            # if ($http_cookie ~* "session|jwt|token") { set $skip_cache 1; }
            # proxy_cache NEXTJS_CACHE;
            # proxy_cache_valid 200 301 302 5s;
            # proxy_cache_bypass $skip_cache;
            # proxy_no_cache $skip_cache;
            # add_header X-Proxy-Cache $upstream_cache_status;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffer_size 32k;
            proxy_buffers 16 16k;
        }

        location / {
            # limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location @json_404 {
            default_type application/json;
            return 404 '{"error":"Not Found","code":404}';
        }

        location @json_429 {
            default_type application/json;
            return 429 '{"error":"Too Many Requests","code":429}';
        }

        error_page 404 = @json_404;
        error_page 429 = @json_429;
        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 500 '{"error":"Internal Server Error","code":500}';
        }
    }
}
