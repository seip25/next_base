networks:
  app_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME:-next_base}_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-next_base}
      MYSQL_USER: ${DB_USER:-next_base}
      MYSQL_PASSWORD: ${DB_PASSWORD:-next_base}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-next_base}_redis
    restart: always
    command: >
      sh -c "
        if [ -n '${REDIS_PASSWORD}' ]; then
          redis-server --requirepass ${REDIS_PASSWORD}
        else
          redis-server
        fi
      "
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: ${APP_NAME:-next_base}_nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html/public:ro
    networks:
      - app_net
    depends_on:
      nextjs:
        condition: service_started

  nextjs:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    image: ${APP_NAME:-next_base}_nextjs
    container_name: ${APP_NAME:-next_base}_nextjs
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${NEXTJS_PORT:-3000}
      DB_HOST: mysql
      REDIS_HOST: redis
    ports:
      - "${NEXTJS_PORT:-3000}:3000"
    networks:
      - app_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pm2-runtime", "ecosystem.config.js"]
